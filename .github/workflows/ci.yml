name: ci

# Triggers: push to master (and to any Claude Code working branch, `claude/**` -- Claude Code
# checks out such a branch when it works on this repo, and a push there runs the same checks)
# and manual runs from the Actions tab.
# Every push to master must build: core engine, overlay/finetune tools, server, console.
# The Linux job builds the production path: this repo's patched ggml tree (patches/ggml-sycl,
# built by scripts/b70/build-llama-sycl.sh with Intel oneAPI + oneDNN SYCL) and the engine against
# it. GitHub runners have no GPU, so the job builds the GPU code paths and runs the tests that do
# not need one (test-io, files-test); the GPU tests (test-backend-ops, vtest) stay on the B70 box.
# There is no Windows job: the engine's sources use POSIX APIs (unistd.h, mmap) that MSVC has no
# equivalent for - the Windows engine build needs a port first, and until then Windows CI would
# only check ggml, which the release workflow covers.
#
# Engine sources need two things from the ggml headers, and a vanilla tree gives neither:
#   1. GGML_TYPE_DSV4_*  -- upstream has them; this workflow pins the commit docs/BUILDING.md
#      names (see LLAMA_SHA). The old pin (ca14269..., Unsloth 2026-09-18) predates them.
#   2. GGML_TYPE_{Q2_0,IQ4_NL,Q8_0}_SOA -- only this repo's patches add them. The release builds
#      take the enum half via .github/scripts/soa-enums.patch: declaring the types is all a CPU/CUDA
#      build needs, since the SOA layout is Intel-SYCL-only and the engine's SOA staging is env-gated
#      (QWFN_Q2_SOA/QWFN_IQ4_SOA/QWFN_Q8_SOA), so the unpatched libggml never sees those types. The
#      Linux job builds the real patched tree.
#
# Caching (actions/cache, per repo/branch, 10 GB cap, 7-day LRU eviction; GitHub-hosted runners
# do all this work -- nothing runs on your machine):
#   Linux: Intel oneAPI (~1.2 GB compressed), the oneDNN SYCL install, and the patched ggml tree
#          + SYCL build, keyed on the pinned SHA and the hash of patches/ggml-sycl. A cold Linux
#          job runs oneAPI install + oneDNN build + ggml SYCL build; a warm one restores all three.
# Bump the -vN suffix in a key to force that cache to rebuild.
on:
  push:
    branches: [master, "claude/**"]
  workflow_dispatch:

env:
  # ggml-org/llama.cpp master, the commit scripts/b70/build-llama-sycl.sh fetches and docs/BUILDING.md
  # names. Keep in sync with that script. The engine code uses ggml_dsv4_hc_pre_gated (in upstream
  # master, in ggml.cpp and in ggml-cpu), declared in ggml.h, so CI builds from this repo's upstream
  # tree: the CPU/CUDA paths compile, link and run; only the Intel GPU kernels (patches/ggml-sycl)
  # stay out, and the Linux job gets them with the patch set.
  LLAMA_SHA: a0e6dc7384edb8f5d927155e1d26c10b4a310e6d

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v6

      - name: Setup toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build liburing-dev python3

      # Intel oneAPI compiler (icx/icpx) + MKL + TBB, the docs/BUILDING.md toolchain for the SYCL tree.
      # The apt packages install into /opt/intel/oneapi; the cache holds a copy in the runner's home
      # (a restore into /opt would need sudo), and every step below uses that copy.
      - name: Cached Intel oneAPI
        id: oneapi
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/oneapi
          key: oneapi-2026.2-v2
      - name: Intel oneAPI install (cache miss)
        if: steps.oneapi.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          # mkl-devel (not just mkl): the apt mkl package is runtime-only, and ggml-sycl's
          # find_package(MKL) needs the cmake config that mkl-devel ships (MKLConfig.cmake).
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl intel-oneapi-mkl-devel intel-oneapi-tbb
          sudo mkdir -p "$HOME/oneapi"
          sudo cp -a /opt/intel/oneapi/. "$HOME/oneapi/"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/oneapi"
      - uses: actions/cache/save@v5
        if: steps.oneapi.outputs.cache-hit != 'true'
        with:
          path: /home/runner/oneapi
          key: ${{ steps.oneapi.outputs.cache-primary-key }}

      # oneDNN with the SYCL runtimes, docs/BUILDING.md's recipe, installed (and cached) under the
      # runner's home. ggml-sycl with GGML_SYCL_DNN=ON links against it.
      - name: Cached oneDNN SYCL build
        id: dnnl
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/onednn-sycl
          key: onednn-sycl-3.11.3-sycl-oneapi-2026.2-v5
      - name: oneDNN SYCL build (cache miss)
        if: steps.dnnl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # setvars.sh exits (killing the step's bash -e shell) on some component probes, and
          # 'source ... || true' cannot catch an exit from a sourced file. Source it in a
          # subshell and re-export what it set.
          eval "$(ONEAPI="$HOME/oneapi/setvars.sh" bash -c 'source "$ONEAPI" --force >/dev/null 2>&1; export')"
          git clone --depth 1 -b v3.11.3 https://github.com/uxlfoundation/oneDNN "$RUNNER_TEMP/oneDNN"
          # oneDNN's CMake hard-requires GPU runtime SYCL when CPU runtime is SYCL, so the GPU
          # kernels compile here too: the apt oneAPI has igc, the same compiler the box runs.
          # The runner has no GPU, which is fine - the kernels only compile, and the build
          # takes a long time (hence the 240-minute timeout). Vendor is pinned to Intel: the
          # default (NVIDIA) would need the CUDA toolkit.
          cmake -S "$RUNNER_TEMP/oneDNN" -B "$RUNNER_TEMP/oneDNN/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DDNNL_CPU_RUNTIME=SYCL -DDNNL_GPU_RUNTIME=SYCL -DDNNL_GPU_VENDOR=INTEL \
            -DCMAKE_INSTALL_PREFIX="$HOME/onednn-sycl"
          cmake --build "$RUNNER_TEMP/oneDNN/build" -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/oneDNN/build"
      - uses: actions/cache/save@v5
        if: steps.dnnl.outputs.cache-hit != 'true'
        with:
          path: /home/runner/onednn-sycl
          key: ${{ steps.dnnl.outputs.cache-primary-key }}

      # The production ggml tree: scripts/b70/build-llama-sycl.sh fetches $LLAMA_SHA, applies every
      # patches/ggml-sycl patch in order, and builds ggml (the CPU variants plus ggml-sycl.so with all
      # 31 kernel patches), llama, and test-backend-ops. Cached whole (source + build-sycl) keyed on
      # the SHA and the hash of the patch set: changing any patch rebuilds the tree.
      - name: Cached patched ggml tree (SYCL)
        id: llama
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/src/llama-b70
          key: llama-v3-${{ env.LLAMA_SHA }}-sycl-${{ hashFiles('patches/ggml-sycl/*.patch') }}-v2
      - name: Patched ggml tree + SYCL build (scripts/b70/build-llama-sycl.sh, cache miss)
        if: steps.llama.outputs.cache-hit != 'true'
        env:
          ONEAPI: /home/runner/oneapi/setvars.sh
          DNNL_DIR: /home/runner/onednn-sycl/lib/cmake/dnnl
        run: scripts/b70/build-llama-sycl.sh "$HOME/src/llama-b70"
      - uses: actions/cache/save@v5
        if: steps.llama.outputs.cache-hit != 'true'
        with:
          path: /home/runner/src/llama-b70
          key: ${{ steps.llama.outputs.cache-primary-key }}

      - name: "Engine: configure + build (core, tools, server)"
        env:
          LLAMA_DIR: /home/runner/src/llama-b70
        run: |
          # The engine links the icx-built ggml shared libs, which drag in Intel runtime libs
          # (libiomp5, libsvml, libirng, ...) from the oneAPI compiler lib dir. The system g++
          # linker does not search there, so add it to LDFLAGS (and to the rpath for ctest).
          IRL=$(ls -d "$HOME/oneapi/compiler/"*/lib | head -1)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CPP_ROOT="$LLAMA_DIR" -DLLAMA_CPP_BUILD="$LLAMA_DIR/build-sycl/bin" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$IRL -Wl,-rpath,$IRL"
          cmake --build build -j "$(nproc)"
      - name: "Engine: run tests"
        env:
          LLAMA_DIR: /home/runner/src/llama-b70
        run: |
          # ggml's shared libs need the Intel runtime libs at run time too (RUNPATH is not
          # transitive), so put the oneAPI compiler lib dir on the loader path for ctest.
          IRL=$(ls -d "$HOME/oneapi/compiler/"*/lib | head -1)
          LD_LIBRARY_PATH="$IRL:$LLAMA_DIR/build-sycl/bin" ctest --test-dir build --output-on-failure

      # The console (the terminal client, src/console/) is a separate frontend with its own build
      # flags (NO_MTP=ON); it is not part of the engine. Enable these steps when the console's
      # sources (currently in the dev tree on the B70 box) are merged into this repo.
      - name: "Console: build"
        if: ${{ false }}
        run: |
          cmake -S . -B build-console -DNO_MTP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-console -j "$(nproc)"
      - name: "Console: run tests"
        if: ${{ false }}
        run: |
          ctest --test-dir build-console --output-on-failure
