name: ci

# Triggers: push to master (and to any Claude Code working branch, `claude/**` -- Claude Code
# checks out such a branch when it works on this repo, and a push there runs the same checks)
# and manual runs from the Actions tab.
# Every push to master must build: core engine, overlay/finetune tools, server, console.
# The Windows job builds the path the Windows bundle ships: upstream llama.cpp on the CPU.
# The Linux job builds the production path: this repo's patched ggml tree (patches/ggml-sycl,
# built by scripts/b70/build-llama-sycl.sh with Intel oneAPI + oneDNN SYCL) and the engine against
# it. GitHub runners have no GPU, so both jobs build the GPU code paths and run the tests that do
# not need one (test-io, files-test); the GPU tests (test-backend-ops, vtest) stay on the B70 box.
#
# Engine sources need two things from the ggml headers, and a vanilla tree gives neither:
#   1. GGML_TYPE_DSV4_*  -- upstream has them; this workflow pins the commit docs/BUILDING.md
#      names (see LLAMA_SHA). The old pin (ca14269..., Unsloth 2026-09-18) predates them.
#   2. GGML_TYPE_{Q2_0,IQ4_NL,Q8_0}_SOA -- only this repo's patches add them. The Windows and
#      release builds take the enum half via .github/scripts/soa-enums.patch: declaring the types
#      is all a CPU/CUDA build needs, since the SOA layout is Intel-SYCL-only and the engine's
#      SOA staging is env-gated (QWFN_Q2_SOA/QWFN_IQ4_SOA/QWFN_Q8_SOA), so the unpatched libggml
#      never sees those types. The Linux job builds the real patched tree.
#
# Caching (actions/cache, per repo/branch, 10 GB cap, 7-day LRU eviction; GitHub-hosted runners
# do all this work -- nothing runs on your machine):
#   Linux: Intel oneAPI (~1.2 GB compressed), the oneDNN SYCL install, and the patched ggml tree
#          + SYCL build, keyed on the pinned SHA and the hash of patches/ggml-sycl. A cold Linux
#          job runs oneAPI install + oneDNN build + ggml SYCL build; a warm one restores all three.
#   Windows: the ggml build, keyed on the pinned SHA and the hash of .github/scripts/soa-enums.patch.
# Bump the -vN suffix in a key to force that cache to rebuild.
on:
  push:
    branches: [master, "claude/**"]
  workflow_dispatch:

env:
  # ggml-org/llama.cpp master, the commit scripts/b70/build-llama-sycl.sh fetches and docs/BUILDING.md
  # names. Keep in sync with that script. The engine code uses ggml_dsv4_hc_pre_gated (in upstream
  # master, in ggml.cpp and in ggml-cpu), declared in ggml.h, so CI builds from this repo's upstream
  # tree: the CPU/CUDA paths compile, link and run; only the Intel GPU kernels (patches/ggml-sycl)
  # stay out, and the Linux job gets them with the patch set.
  LLAMA_SHA: a0e6dc7384edb8f5d927155e1d26c10b4a310e6d

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v6

      - name: Setup toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build liburing-dev python3

      # Intel oneAPI compiler (icx/icpx) + MKL + TBB, the docs/BUILDING.md toolchain for the SYCL tree.
      # The apt packages install into /opt/intel/oneapi; the cache holds a copy in the runner's home
      # (a restore into /opt would need sudo), and every step below uses that copy.
      - name: Cached Intel oneAPI
        id: oneapi
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.home }}/oneapi
          key: oneapi-2026.2-v1
      - name: Intel oneAPI install (cache miss)
        if: steps.oneapi.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-compiler-dpcpp-cpp intel-oneapi-mkl intel-oneapi-tbb
          sudo mkdir -p "$HOME/oneapi"
          sudo cp -a /opt/intel/oneapi/. "$HOME/oneapi/"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/oneapi"
      - uses: actions/cache/save@v5
        if: steps.oneapi.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.home }}/oneapi
          key: ${{ steps.oneapi.outputs.cache-primary-key }}

      # oneDNN with the SYCL runtimes, docs/BUILDING.md's recipe, installed (and cached) under the
      # runner's home. ggml-sycl with GGML_SYCL_DNN=ON links against it.
      - name: Cached oneDNN SYCL build
        id: dnnl
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.home }}/onednn-sycl
          key: onednn-sycl-3.11.3-cpu-oneapi-2026.2-v3
      - name: oneDNN SYCL build (cache miss)
        if: steps.dnnl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source "$HOME/oneapi/setvars.sh" --force > /dev/null 2>&1 || true
          git clone --depth 1 -b v3.11.3 https://github.com/uxlfoundation/oneDNN "$RUNNER_TEMP/oneDNN"
          # GPU_RUNTIME=NONE: the runner has no Intel GPU and apt's oneAPI lacks the offline
          # Intel-GPU kernel generator, so compiling GPU kernels here is pointless - the API
          # ggml-sycl's GGML_SYCL_DNN code uses (dnnl::sycl_interop, SYCL CPU runtime) is
          # present. The GPU kernels stay on the box build.
          cmake -S "$RUNNER_TEMP/oneDNN" -B "$RUNNER_TEMP/oneDNN/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx \
            -DDNNL_CPU_RUNTIME=SYCL -DDNNL_GPU_RUNTIME=NONE \
            -DCMAKE_INSTALL_PREFIX="$HOME/onednn-sycl"
          cmake --build "$RUNNER_TEMP/oneDNN/build" -j "$(nproc)"
          cmake --install "$RUNNER_TEMP/oneDNN/build"
      - uses: actions/cache/save@v5
        if: steps.dnnl.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.home }}/onednn-sycl
          key: ${{ steps.dnnl.outputs.cache-primary-key }}

      # The production ggml tree: scripts/b70/build-llama-sycl.sh fetches $LLAMA_SHA, applies every
      # patches/ggml-sycl patch in order, and builds ggml (the CPU variants plus ggml-sycl.so with all
      # 31 kernel patches), llama, and test-backend-ops. Cached whole (source + build-sycl) keyed on
      # the SHA and the hash of the patch set: changing any patch rebuilds the tree.
      - name: Cached patched ggml tree (SYCL)
        id: llama
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.home }}/src/llama-b70
          key: llama-v3-${{ env.LLAMA_SHA }}-sycl-${{ hashFiles('patches/ggml-sycl/*.patch') }}-v1
      - name: Patched ggml tree + SYCL build (scripts/b70/build-llama-sycl.sh, cache miss)
        if: steps.llama.outputs.cache-hit != 'true'
        env:
          ONEAPI: ${{ runner.home }}/oneapi/setvars.sh
          DNNL_DIR: ${{ runner.home }}/onednn-sycl/lib/cmake/dnnl
        run: scripts/b70/build-llama-sycl.sh "$HOME/src/llama-b70"
      - uses: actions/cache/save@v5
        if: steps.llama.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.home }}/src/llama-b70
          key: ${{ steps.llama.outputs.cache-primary-key }}

      - name: "Engine: configure + build (core, tools, server)"
        env:
          LLAMA_DIR: ${{ runner.home }}/src/llama-b70
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CPP_ROOT="$LLAMA_DIR" -DLLAMA_CPP_BUILD="$LLAMA_DIR/build-sycl/bin"
          cmake --build build -j "$(nproc)"
      - name: "Engine: run tests"
        run: |
          ctest --test-dir build --output-on-failure

      # The console (the terminal client, src/console/) is a separate frontend with its own build
      # flags (NO_MTP=ON); it is not part of the engine. Enable these steps when the console's
      # sources (currently in the dev tree on the B70 box) are merged into this repo.
      - name: "Console: build"
        if: ${{ false }}
        run: |
          cmake -S . -B build-console -DNO_MTP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-console -j "$(nproc)"
      - name: "Console: run tests"
        if: ${{ false }}
        run: |
          ctest --test-dir build-console --output-on-failure

  windows:
    name: windows-x86_64
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      # MSVC environment for all bash steps (vcvars all: cl, link, lib, rc, mt, cl.exe in PATH)
      - uses: ./.github/actions/windows-msvc-env
        id: msvc-env

      # cmake + ninja on PATH (both ship on the runner image, but not on PATH by default)
      - name: CMake + Ninja
        run: |
          choco install ninja -y --no-progress
          cmake --version
          ninja --version

      # llama.cpp source: upstream ggml-org master at $LLAMA_SHA (the CPU path needs no Intel GPU,
      # no SYCL) plus the SOA enum shim so the engine's sources compile (see the header comment).
      - name: "llama.cpp source (upstream, CPU: no SYCL, no Intel GPU)"
        run: |
          git init -q "$HOME/llama.cpp"
          git -C "$HOME/llama.cpp" config core.autocrlf false
          git -C "$HOME/llama.cpp" fetch -q --depth 1 https://github.com/ggml-org/llama.cpp "$env:LLAMA_SHA"
          git -C "$HOME/llama.cpp" checkout -q FETCH_HEAD
          # Windows runners check out the repo with core.autocrlf=true: the patch file arrives
          # CRLF while the fetched tree is LF (autocrlf off above). Normalize, then apply.
          $p = "$env:GITHUB_WORKSPACE\.github\scripts\soa-enums.patch"
          (Get-Content $p -Raw) -replace "`r`n", "`n" | Set-Content -NoNewline -Encoding UTF8 $p
          git -C "$HOME/llama.cpp" apply "$p"
          if ($LASTEXITCODE) { exit 1 }

      # Cached ggml + llama build (CPU-only, Release, shared libs, all x86 CPU variants; upstream's
      # GGML_CPU_ALL_VARIANTS requires GGML_BACKEND_DL, the dll/dl backends loaded at runtime).
      # Restore and save are separate steps so the build is kept the moment it exists, even when a
      # later step fails (the combined action saves only at the end of a successful job).
      - name: Cached ggml build
        id: ggml-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/llama.cpp/build
          key: llama-v3-${{ env.LLAMA_SHA }}-soa-${{ hashFiles('.github/scripts/soa-enums.patch') }}-cpu-release-dl-msvc${{ steps.msvc-env.outputs.msvc-version }}
      - name: Build ggml + llama.cpp (cache miss)
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "$HOME/llama.cpp" -B "$HOME/llama.cpp/build" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF `
            -DGGML_OPENMP=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_BACKEND_DL=ON
          cmake --build "$HOME/llama.cpp/build"
      - uses: actions/cache/save@v5
        if: steps.ggml-cache.outputs.cache-hit != 'true'
        with:
          path: ~/llama.cpp/build
          key: ${{ steps.ggml-cache.outputs.cache-primary-key }}

      # Engine build: CMakeLists resolves headers from LLAMA_CPP_ROOT, links against
      # the prebuilt libs from LLAMA_CPP_BUILD (no llama.cpp recompile), and
      # compiles all engine + tools sources with cl.exe (no liburing on Windows;
      # IO is threaded)
      - name: "Engine: configure + build (core, tools, server)"
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_CPP_ROOT="$HOME/llama.cpp" -DLLAMA_CPP_BUILD="$HOME/llama.cpp/build/bin"
          cmake --build build
      # ctest is the verification: test-io and files-test are the engine's own tests (no GPU). There
      # is no --help in qwfn_server.cpp (the arg is a model path), so a CLI smoke test is not possible
      # without a model; the binary's presence is implied by the build.
      - name: "Engine: run tests"
        run: |
          ctest --test-dir build --output-on-failure

      # Console steps skipped (same as Linux). Enable when console sources are merged into repo.
      - name: "Console: build"
        if: ${{ false }}
        run: |
          cmake -S . -B build-console -G Ninja -DNO_MTP=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-console
      - name: "Console: run tests"
        if: ${{ false }}
        run: |
          ctest --test-dir build-console --output-on-failure
